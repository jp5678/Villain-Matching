<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Bridge - Today's Villain Matching</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --felt-green: #0a3d31;
            --gold: #d4af37;
            --gold-light: #f1d592;
            --white: #ffffff;
            --yellow: #ffd700;
            --red: #ff3b30;
            --neon-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            z-index: 1;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        header .subtitle {
            font-size: 0.9rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .table-container {
            position: relative;
            width: 94%;
            max-width: 480px;
            aspect-ratio: 1.6 / 1;
            background-color: var(--felt-green);
            border: 18px solid #2c1a12;
            border-radius: 30px;
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.9),
                inset 0 0 100px rgba(0,0,0,0.7);
            margin-bottom: 45px;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .table-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.4);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
            z-index: 2;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--gold), #b38f2d);
            color: #1a1100;
            border: none;
            padding: 22px 55px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
            min-width: 320px;
        }

        .main-btn:active {
            transform: scale(0.94) translateY(4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .main-btn:disabled {
            filter: grayscale(1);
            opacity: 0.8;
            cursor: wait;
        }

        .sound-hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-top: 15px;
            letter-spacing: 1px;
        }

        #results {
            width: 90%;
            max-width: 500px;
            padding-bottom: 80px;
            display: grid;
            gap: 18px;
        }

        .match-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 24px;
            opacity: 0;
            transform: scale(0.95) translateY(25px);
            animation: cardAppear 0.6s forwards cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 10px;
        }

        .match-body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
        }

        .player-box {
            text-align: center;
            width: 42%;
        }

        .player-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .vs-badge {
            background: linear-gradient(135deg, #333, #111);
            padding: 6px 12px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .comment-box {
            background: rgba(46, 204, 113, 0.1);
            border: 1px dashed rgba(46, 204, 113, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #afff60;
            font-style: italic;
            line-height: 1.4;
        }

        footer {
            padding: 50px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            line-height: 1.8;
            z-index: 1;
        }

        .glow {
            animation: neonGlow 2s infinite alternate;
        }

        @keyframes neonGlow {
            from { text-shadow: 0 0 10px var(--gold), 0 0 20px rgba(212, 175, 55, 0.2); }
            to { text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold-light); }
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle" style="opacity: 0.6;">EST. 2025</div>
        <h1 class="glow">THE BRIDGE</h1>
        <div class="subtitle">Today's Villain Matching</div>
    </header>

    <div class="table-container">
        <canvas id="billiardCanvas"></canvas>
        <div class="table-overlay"></div>
    </div>

    <div class="controls">
        <button class="main-btn" id="actionBtn" onclick="handleStart()">
            <span>🎱</span> 운명의 큐대 돌리기
        </button>
        <div class="sound-hint">※ 사운드가 켜져 있는지 확인해 주세요</div>
    </div>

    <div id="results"></div>

    <footer>
        &copy; 2025 THE BRIDGE BILLIARDS CLUB<br>
        모든 권한은 더 브릿지 회원님들께 있습니다.
    </footer>

    <script>
        const members = [
            "백사6000", "려리", "kbh", "발칸VULCAN", 
            "지교", "무등산1329", "입석대", "케이574", 
            "그렌다이저", "SMG", "도유나가즈아", "메롱상태"
        ];

        const comments = [
            "이 매칭... 사실상 결승전 아닌가요? 관전 필수!",
            "님의 큐 끝이 심상치 않습니다. 조심하세요!",
            "오늘 지는 분이 시원하게 한 잔 쏘는 각입니다.",
            "예술구와 정석구의 피할 수 없는 정면 승부!",
            "오늘의 빌런 향기가 물씬 풍기는 조합입니다.",
            "패자는 조용히 카운터로, 승자는 당구대에 남으세요.",
            "실력 차이는 종잇장 한 장 차이! 정신력이 승패를 가릅니다.",
            "두 분, 어제 남몰래 야간 특훈하신 거 다 소문났습니다.",
            "세기의 대결! 첫 이닝 초구 성공 여부가 관건입니다.",
            "큐 잡는 손이 바들바들... 긴장하면 지는 겁니다!"
        ];

        const retryPhrases = [
            "인정 못해! 판 다시 짜기",
            "큐대 다시 잡고 리매치",
            "빌런 재배치 (복수전)",
            "운명의 장난, 다시 한 번?",
            "새로운 희생양(?) 찾기",
            "대진표가 맘에 안 들면 클릭",
            "한 판 더? (이번엔 진짜임)",
            "조합이 맵다! 다시 돌리기"
        ];

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playCollisionSound(intensity = 1) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const volume = Math.min(intensity / 15, 0.3);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160 + (Math.random() * 40), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.1));
                
                gain.gain.setValueAtTime(0.2, now + (i * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + (i * 0.1));
                osc.stop(now + (i * 0.1) + 0.6);
            });
        }

        const canvas = document.getElementById('billiardCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];
        let animationId;
        let isSimulating = false;

        class Ball {
            constructor(x, y, vx, vy, color, label) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 10; 
                this.color = color;
                this.label = label;
                this.friction = 0.996; 
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                const grad = ctx.createRadialGradient(
                    this.x - this.radius/2.5, this.y - this.radius/2.5, this.radius/10,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, this.color);
                grad.addColorStop(1, '#000');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }

            update() {
                if (!isSimulating) return;

                this.x += this.vx;
                this.y += this.vy;

                let hitWall = false;
                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                    this.vx = -this.vx;
                    this.x = this.x - this.radius < 0 ? this.radius : canvas.width - this.radius;
                    hitWall = true;
                }
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                    this.vy = -this.vy;
                    this.y = this.y - this.radius < 0 ? this.radius : canvas.height - this.radius;
                    hitWall = true;
                }

                if (hitWall) {
                    playCollisionSound(Math.abs(this.vx) + Math.abs(this.vy));
                }

                this.vx *= this.friction;
                this.vy *= this.friction;

                balls.forEach(other => {
                    if (other === this) return;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < this.radius + other.radius) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const overlap = (this.radius + other.radius) - distance;
                        this.x -= (overlap / 2) * cos;
                        this.y -= (overlap / 2) * sin;
                        other.x += (overlap / 2) * cos;
                        other.y += (overlap / 2) * sin;

                        const v1 = { x: this.vx * cos + this.vy * sin, y: this.vy * cos - this.vx * sin };
                        const v2 = { x: other.vx * cos + other.vy * sin, y: other.vy * cos - other.vx * sin };

                        const temp = v1.x;
                        v1.x = v2.x;
                        v2.x = temp;

                        this.vx = v1.x * cos - v1.y * sin;
                        this.vy = v1.y * cos + v1.x * sin;
                        other.vx = v2.x * cos - v2.y * sin;
                        other.vy = v2.y * cos + v2.x * sin;

                        playCollisionSound(Math.abs(this.vx) + Math.abs(other.vx));
                    }
                });
            }
        }

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            balls = [
                new Ball(canvas.width * 0.2, canvas.height * 0.4, 0, 0, '#ffffff', 'W'),
                new Ball(canvas.width * 0.5, canvas.height * 0.6, 0, 0, '#ffd700', 'Y'),
                new Ball(canvas.width * 0.8, canvas.height * 0.4, 0, 0, '#ff3b30', 'R')
            ];
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });
            animationId = requestAnimationFrame(render);
        }

        const loadingTexts = [
            "운명의 초이스 진행 중...",
            "빌런들의 기운을 매칭하고 있습니다...",
            "두께 1/4, 회전 맥시멈 조절 중...",
            "3쿠션 경로를 정밀 분석 중...",
            "운명의 큐 끝이 멈추려 합니다...",
            "거의 다 왔습니다. 긴장하세요!"
        ];

        function handleStart() {
            initAudio();
            const btn = document.getElementById('actionBtn');
            const resultsDiv = document.getElementById('results');
            
            btn.disabled = true;
            let textIdx = 0;
            btn.innerHTML = `<span>⏳</span> ${loadingTexts[textIdx]}`;
            
            const textInterval = setInterval(() => {
                textIdx = (textIdx + 1) % loadingTexts.length;
                btn.innerHTML = `<span>⏳</span> ${loadingTexts[textIdx]}`;
            }, 1400);

            resultsDiv.innerHTML = '';
            
            isSimulating = true;
            balls.forEach(ball => {
                ball.vx = (Math.random() - 0.5) * 16;
                ball.vy = (Math.random() - 0.5) * 16;
            });

            setTimeout(() => {
                clearInterval(textInterval);
                isSimulating = false;
                
                playSuccessSound();
                showResults();
                
                const randomPhrase = retryPhrases[Math.floor(Math.random() * retryPhrases.length)];
                btn.disabled = false;
                btn.innerHTML = `<span>🔄</span> ${randomPhrase}`;
            }, 8500);
        }

        function showResults() {
            const shuffled = [...members].sort(() => Math.random() - 0.5);
            const resultsDiv = document.getElementById('results');
            
            for (let i = 0; i < shuffled.length; i += 2) {
                const p1 = shuffled[i];
                const p2 = shuffled[i+1];
                const comment = comments[Math.floor(Math.random() * comments.length)];
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.animationDelay = `${(i/2) * 0.35}s`;
                
                card.innerHTML = `
                    <div class="match-header">
                        <!-- BRIDGE MATCH에서 THE BRIDGE MATCH로 수정됨 -->
                        <span>THE BRIDGE MATCH ${i/2 + 1}</span>
                        <span>OFFICIAL 2026</span>
                    </div>
                    <div class="match-body">
                        <div class="player-box">
                            <div class="player-name">${p1}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="player-box">
                            <div class="player-name">${p2}</div>
                        </div>
                    </div>
                    <div class="comment-box">${comment}</div>
                `;
                resultsDiv.appendChild(card);
            }

            setTimeout(() => {
                window.scrollTo({ top: resultsDiv.offsetTop - 40, behavior: 'smooth' });
            }, 400);
        }

        window.onload = initCanvas;
        window.onresize = initCanvas;
    </script>
</body>
</html>

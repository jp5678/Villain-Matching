<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Bridge - Today's Villain Matching</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --felt-green: #0a3d31;
            --gold: #d4af37;
            --gold-light: #f1d592;
            --white: #ffffff;
            --yellow: #ffd700;
            --red: #ff3b30;
            --neon-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            z-index: 1;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        header .subtitle {
            font-size: 0.9rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .table-container {
            position: relative;
            width: 94%;
            max-width: 480px;
            aspect-ratio: 1.6 / 1;
            background-color: var(--felt-green);
            border: 18px solid #2c1a12;
            border-radius: 30px;
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.9),
                inset 0 0 100px rgba(0,0,0,0.7);
            margin-bottom: 45px;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .table-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.4);
        }

        .roster {
            width: 90%;
            max-width: 500px;
            margin-bottom: 30px;
            z-index: 2;
        }

        .roster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .roster-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .roster-count {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .member-chip {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.18) 0%, rgba(46, 204, 113, 0.08) 100%);
            border: 1px solid rgba(46, 204, 113, 0.45);
            color: var(--white);
            border-radius: 14px;
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .member-chip::before {
            content: "✓";
            margin-right: 5px;
            color: var(--neon-green);
            font-weight: 900;
        }

        .member-chip.absent {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.35);
            text-decoration: line-through;
        }

        .member-chip.absent::before {
            content: "✕";
            color: var(--red);
        }

        .member-chip:active {
            transform: scale(0.93);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
            z-index: 2;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--gold), #b38f2d);
            color: #1a1100;
            border: none;
            padding: 22px 55px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
            min-width: 320px;
        }

        .main-btn:active {
            transform: scale(0.94) translateY(4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .main-btn:disabled {
            filter: grayscale(1);
            opacity: 0.8;
            cursor: wait;
        }

        .sound-hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-top: 15px;
            letter-spacing: 1px;
        }

        #results {
            width: 90%;
            max-width: 500px;
            padding-bottom: 80px;
            display: grid;
            gap: 18px;
        }

        /* 경기 카드 = 당구대(진회색 레일·은색 띠 + 파란 천). 천은 조명처럼 가운데가 밝고 바깥이 어두움 */
        .match-card {
            background:
                linear-gradient(180deg, rgba(8, 32, 72, 0.42) 0, rgba(8, 32, 72, 0) 52px),
                radial-gradient(ellipse 70% 72% at 50% 60%, #3592e4 0%, #2a7fd4 45%, #2068bb 80%, #1b5ca9 100%);
            border: 7px solid #3f4247;
            border-radius: 16px;
            padding: 20px;
            opacity: 0;
            transform: scale(0.95) translateY(25px);
            animation: cardAppear 0.6s forwards cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: inset 0 0 0 2px #9aa3ae, inset 0 6px 14px rgba(0, 30, 70, 0.25), 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        /* 위·아래 레일의 포인트(다이아몬드) */
        .match-card::before {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 16px;
            pointer-events: none;
            background:
                radial-gradient(circle, rgba(255,255,255,0.92) 0 1.3px, transparent 1.9px) 0 0 / 12.5% 7px repeat-x,
                radial-gradient(circle, rgba(255,255,255,0.92) 0 1.3px, transparent 1.9px) 0 100% / 12.5% 7px repeat-x;
        }

        [hidden] {
            display: none !important;
        }

        /* 대진표 이미지 공유 버튼 */
        .share-btn {
            justify-self: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.1);
            border: 1.5px solid var(--gold);
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            animation: cardAppear 0.6s forwards cubic-bezier(0.23, 1, 0.32, 1);
        }

        .share-btn:active {
            transform: scale(0.96);
        }

        .share-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* 공유 기능이 없는 환경용 이미지 미리보기 */
        .share-preview {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.85);
        }

        .share-preview-inner {
            width: 100%;
            max-width: 440px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .share-preview-inner img {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            object-fit: contain;
            border-radius: 12px;
        }

        .share-preview-inner p {
            margin: 0;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
        }

        .share-preview-actions {
            display: flex;
            gap: 10px;
        }

        .share-preview-actions .share-btn {
            opacity: 1;
            animation: none;
            margin-top: 0;
        }

        .share-close {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: var(--white);
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 60px;
            cursor: pointer;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 20, 50, 0.6);
            text-transform: uppercase;
        }

        /* 헤더 글씨가 하나뿐이면(MATCH n) 가운데 정렬 */
        .match-header span:only-child {
            margin: 0 auto;
        }

        .match-body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
        }

        .player-box {
            text-align: center;
            width: 44%;
            background: #141b22;
            border: 1.5px solid rgba(5, 7, 10, 0.35);
            border-radius: 12px;
            padding: 12px 4px;
        }

        .player-name {
            font-size: clamp(0.95rem, 4.2vw, 1.15rem);
            font-weight: 800;
            color: var(--gold);
            letter-spacing: -0.5px;
            overflow-wrap: anywhere;
        }

        .vs-badge {
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: #333;
        }

        .comment-box {
            padding: 0 6px;
            margin-top: 18px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 20, 50, 0.6);
            line-height: 1.4;
        }

        footer {
            padding: 50px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            line-height: 1.8;
            z-index: 1;
        }

        .glow {
            animation: neonGlow 2s infinite alternate;
        }

        /* 부전승 회원 이름 깜박임 */
        .blink {
            animation: nameBlink 1s steps(1, end) infinite;
        }

        @keyframes nameBlink {
            50% { opacity: 0.15; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blink { animation: none; }
        }

        @keyframes neonGlow {
            from { text-shadow: 0 0 10px var(--gold), 0 0 20px rgba(212, 175, 55, 0.2); }
            to { text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold-light); }
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle" style="opacity: 0.6;">GWANGJU, SOUTH KOREA</div>
        <h1 class="glow">THE BRIDGE</h1>
        <div class="subtitle">Today's Villain Matching</div>
    </header>

    <div class="table-container">
        <canvas id="billiardCanvas"></canvas>
        <div class="table-overlay"></div>
    </div>

    <div class="roster">
        <div class="roster-header">
            <span class="roster-title">참석 회원 선택</span>
            <span class="roster-count" id="rosterCount">참석 0명</span>
        </div>
        <div class="roster-grid" id="rosterGrid"></div>
    </div>

    <div class="controls">
        <button class="main-btn" id="actionBtn" onclick="handleStart()">
            <span>🎱</span> 운명의 큐대 돌리기
        </button>
        <div class="sound-hint">※ 불참 회원은 이름을 눌러 제외하세요</div>
    </div>

    <div id="results"></div>

    <div id="sharePreview" class="share-preview" hidden>
        <div class="share-preview-inner">
            <img id="sharePreviewImg" alt="오늘의 대진표">
            <p>휴대폰에서는 이미지를 길게 눌러 저장할 수 있습니다.</p>
            <div class="share-preview-actions">
                <a id="shareDownload" class="share-btn">💾 이미지 저장</a>
                <button type="button" class="share-close" onclick="closeSharePreview()">닫기</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 THE BRIDGE BILLIARDS CLUB<br>
        모든 권한은 더 브릿지 회원님들께 있습니다.
    </footer>

    <script>
        const members = [
            "kbh5111", "발칸VULCAN", "Woodstock69", "지교", "그렌다이저", "바람돌이5741", 
            "무등산1329", "입석대", "메롱상태", "백사6000", "케이574", "려리", 
            "도유나가즈아", "SMG", "솔미태"
        ];

        // 당일 참석 여부 (true: 참석, false: 불참) - 기본값 전원 참석
        const attendance = members.map(() => true);

        function renderRoster() {
            const grid = document.getElementById('rosterGrid');
            grid.innerHTML = '';
            members.forEach((name, idx) => {
                const chip = document.createElement('div');
                chip.className = 'member-chip' + (attendance[idx] ? '' : ' absent');
                chip.textContent = name;
                chip.title = name;
                chip.onclick = () => {
                    attendance[idx] = !attendance[idx];
                    chip.classList.toggle('absent', !attendance[idx]);
                    updateRosterCount();
                };
                grid.appendChild(chip);
            });
            updateRosterCount();
        }

        function updateRosterCount() {
            const count = attendance.filter(Boolean).length;
            document.getElementById('rosterCount').textContent = `참석 ${count}명`;
        }

        function getAttendingMembers() {
            return members.filter((_, idx) => attendance[idx]);
        }

        const comments = [
            "이 매칭... 사실상 결승전 아닌가요? 관전 필수!",
            "님의 큐 끝이 심상치 않습니다. 조심하세요!",
            "오늘 지는 분이 시원하게 한 잔 쏘는 각입니다.",
            "예술구와 정석구의 피할 수 없는 정면 승부!",
            "오늘의 빌런 향기가 물씬 풍기는 조합입니다.",
            "패자는 조용히 카운터로, 승자는 당구대에 남으세요.",
            "실력 차이는 종잇장 한 장 차이! 정신력이 승패를 가릅니다.",
            "두 분, 어제 남몰래 야간 특훈하신 거 다 소문났습니다.",
            "세기의 대결! 첫 이닝 초구 성공 여부가 관건입니다.",
            "큐 잡는 손이 바들바들... 긴장하면 지는 겁니다!",
            "쓰리쿠션 각도기 장착 완료! 오늘은 계산 싸움입니다.",
            "키스 한 번에 운명이 갈립니다. 공 간격 조심하세요!",
            "초구부터 하이런 터지면 그대로 게임 끝입니다.",
            "오늘 큐 팁에 초크 두 번 바르셨죠? 다 보입니다.",
            "뱅크샷 장인 대 시스템 장인, 승자는 누구일까요?",
            "빈쿠션 한 방이면 분위기 반전! 끝까지 모릅니다.",
            "구경꾼이 더 긴장되는 대진입니다. 숨죽이고 관전하세요!",
            "운은 이미 다 썼다? 이제부터는 진짜 실력입니다.",
            "마지막 한 큐까지 방심 금물! 역전의 냄새가 납니다.",
            "점수판 넘기는 손이 바빠질 예정입니다."
        ];

        const BYE_COMMENT = "싸우지 않고 이기는 것이 최고의 승리! 운도 실력, 이번 판은 부전승으로 1승 챙기셨습니다.";

        const retryPhrases = [
            "인정 못해! 판 다시 짜기",
            "큐대 다시 잡고 리매치",
            "빌런 재배치 (복수전)",
            "운명의 장난, 다시 한 번?",
            "새로운 희생양(?) 찾기",
            "대진표가 맘에 안 들면 클릭",
            "한 판 더? (이번엔 진짜임)",
            "조합이 맵다! 다시 돌리기"
        ];

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playCollisionSound(intensity = 1) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const volume = Math.min(intensity / 15, 0.3);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160 + (Math.random() * 40), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + (i * 0.1));
                
                gain.gain.setValueAtTime(0.2, now + (i * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.6);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + (i * 0.1));
                osc.stop(now + (i * 0.1) + 0.6);
            });
        }

        const canvas = document.getElementById('billiardCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];
        let animationId;
        let isSimulating = false;
        let simulationStart = 0;
        let simulationDuration = 0;

        // 시뮬레이션 진행도(0~1)에 따라 마찰력을 반환한다.
        // 진행도가 높아질수록 마찰을 단계적으로 강하게 주어
        // 공이 자연스럽게 천천히 감속하다 멈추도록 한다.
        function getFrictionForProgress(progress) {
            if (progress < 0.3) return 0.999;   // 초반: 거의 등속으로 굴러감
            if (progress < 0.5) return 0.997;   // 초중반: 아주 완만하게 감속
            if (progress < 0.7) return 0.992;   // 중반: 서서히 감속 시작
            if (progress < 0.85) return 0.98;   // 중후반: 눈에 띄게 느려짐
            if (progress < 0.95) return 0.95;   // 후반: 확연히 감속
            return 0.90;                        // 막바지: 천천히 멈춤
        }

        class Ball {
            constructor(x, y, vx, vy, color, label) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 10; 
                this.color = color;
                this.label = label;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                const grad = ctx.createRadialGradient(
                    this.x - this.radius/2.5, this.y - this.radius/2.5, this.radius/10,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, this.color);
                grad.addColorStop(1, '#000');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }

            update() {
                if (!isSimulating) return;

                this.x += this.vx;
                this.y += this.vy;

                let hitWall = false;
                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) {
                    this.vx = -this.vx;
                    this.x = this.x - this.radius < 0 ? this.radius : canvas.width - this.radius;
                    hitWall = true;
                }
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) {
                    this.vy = -this.vy;
                    this.y = this.y - this.radius < 0 ? this.radius : canvas.height - this.radius;
                    hitWall = true;
                }

                if (hitWall) {
                    playCollisionSound(Math.abs(this.vx) + Math.abs(this.vy));
                }

                const progress = simulationDuration > 0
                    ? Math.min((performance.now() - simulationStart) / simulationDuration, 1)
                    : 0;
                const friction = getFrictionForProgress(progress);
                this.vx *= friction;
                this.vy *= friction;

                balls.forEach(other => {
                    if (other === this) return;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < this.radius + other.radius) {
                        const angle = Math.atan2(dy, dx);
                        const sin = Math.sin(angle);
                        const cos = Math.cos(angle);

                        const overlap = (this.radius + other.radius) - distance;
                        this.x -= (overlap / 2) * cos;
                        this.y -= (overlap / 2) * sin;
                        other.x += (overlap / 2) * cos;
                        other.y += (overlap / 2) * sin;

                        const v1 = { x: this.vx * cos + this.vy * sin, y: this.vy * cos - this.vx * sin };
                        const v2 = { x: other.vx * cos + other.vy * sin, y: other.vy * cos - other.vx * sin };

                        const temp = v1.x;
                        v1.x = v2.x;
                        v2.x = temp;

                        this.vx = v1.x * cos - v1.y * sin;
                        this.vy = v1.y * cos + v1.x * sin;
                        other.vx = v2.x * cos - v2.y * sin;
                        other.vy = v2.y * cos + v2.x * sin;

                        playCollisionSound(Math.abs(this.vx) + Math.abs(other.vx));
                    }
                });
            }
        }

        function initCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            balls = [
                new Ball(canvas.width * 0.2, canvas.height * 0.4, 0, 0, '#ffffff', 'W'),
                new Ball(canvas.width * 0.5, canvas.height * 0.6, 0, 0, '#ffd700', 'Y'),
                new Ball(canvas.width * 0.8, canvas.height * 0.4, 0, 0, '#ff3b30', 'R')
            ];
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });
            animationId = requestAnimationFrame(render);
        }

        const loadingTexts = [
            "운명의 초이스 진행 중...",
            "빌런들의 기운을 매칭하고 있습니다...",
            "두께 1/4, 회전 맥시멈 조절 중...",
            "3쿠션 경로를 정밀 분석 중...",
            "운명의 큐 끝이 멈추려 합니다...",
            "거의 다 왔습니다. 긴장하세요!"
        ];

        function handleStart() {
            initAudio();
            const btn = document.getElementById('actionBtn');
            const resultsDiv = document.getElementById('results');

            const attendingCount = getAttendingMembers().length;
            if (attendingCount < 2) {
                alert('매칭을 하려면 최소 2명 이상 참석해야 합니다.\n현재 참석 인원: ' + attendingCount + '명');
                return;
            }

            btn.disabled = true;
            let textIdx = 0;
            btn.innerHTML = `<span>⏳</span> ${loadingTexts[textIdx]}`;
            
            const textInterval = setInterval(() => {
                textIdx = (textIdx + 1) % loadingTexts.length;
                btn.innerHTML = `<span>⏳</span> ${loadingTexts[textIdx]}`;
            }, 1400);

            resultsDiv.innerHTML = '';

            // 10초~15초 사이의 랜덤 시간 동안 공이 움직이다가 천천히 멈춘다.
            simulationDuration = 10000 + Math.random() * 5000;
            simulationStart = performance.now();
            isSimulating = true;
            balls.forEach(ball => {
                // 초기 속도를 기존의 절반 수준으로 낮춰 너무 빠르지 않게 한다.
                ball.vx = (Math.random() - 0.5) * 8;
                ball.vy = (Math.random() - 0.5) * 8;
            });

            setTimeout(() => {
                clearInterval(textInterval);
                isSimulating = false;
                // 남아있는 미세한 속도를 0으로 정리한다.
                balls.forEach(ball => {
                    ball.vx = 0;
                    ball.vy = 0;
                });

                playSuccessSound();
                showResults();

                const randomPhrase = retryPhrases[Math.floor(Math.random() * retryPhrases.length)];
                btn.disabled = false;
                btn.innerHTML = `<span>🔄</span> ${randomPhrase}`;
            }, simulationDuration);
        }

        function showResults() {
            // 당일 참석한 회원만 매칭 대상으로 셔플
            const shuffled = getAttendingMembers().sort(() => Math.random() - 0.5);
            const resultsDiv = document.getElementById('results');
            const attendCount = shuffled.length;
            const matchData = { pairs: [], bye: null, attendCount };

            // 참석 인원이 홀수면 마지막 1명은 부전승(대기)으로 분리
            const hasBye = shuffled.length % 2 === 1;
            const byePlayer = hasBye ? shuffled.pop() : null;

            // 한 번의 대진에서 코멘트가 겹치지 않도록 섞어서 차례로 사용
            const commentPool = [...comments].sort(() => Math.random() - 0.5);

            for (let i = 0; i < shuffled.length; i += 2) {
                const p1 = shuffled[i];
                const p2 = shuffled[i+1];
                const comment = commentPool[(i/2) % commentPool.length];
                matchData.pairs.push({ p1, p2, comment });

                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.animationDelay = `${(i/2) * 0.35}s`;

                card.innerHTML = `
                    <div class="match-header">
                        <span>MATCH ${i/2 + 1}</span>
                    </div>
                    <div class="match-body">
                        <div class="player-box">
                            <div class="player-name">${p1}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="player-box">
                            <div class="player-name">${p2}</div>
                        </div>
                    </div>
                    <div class="comment-box">${comment}</div>
                `;
                resultsDiv.appendChild(card);
            }

            // 부전승 카드 (참석자가 홀수일 때)
            if (byePlayer) {
                const byeCard = document.createElement('div');
                byeCard.className = 'match-card';
                byeCard.style.animationDelay = `${(shuffled.length/2) * 0.35}s`;
                byeCard.innerHTML = `
                    <div class="match-header">
                        <span>부전승</span>
                    </div>
                    <div class="match-body">
                        <div class="player-box" style="width: 100%;">
                            <div class="player-name blink">${byePlayer}</div>
                        </div>
                    </div>
                    <div class="comment-box">${BYE_COMMENT}</div>
                `;
                resultsDiv.appendChild(byeCard);
                matchData.bye = { name: byePlayer, comment: BYE_COMMENT };
            }

            // 대진표 이미지 공유 버튼 (마지막 카드 다음에 등장)
            const cardCount = matchData.pairs.length + (byePlayer ? 1 : 0);
            const shareBtn = document.createElement('button');
            shareBtn.type = 'button';
            shareBtn.id = 'shareBtn';
            shareBtn.className = 'share-btn';
            shareBtn.style.animationDelay = `${cardCount * 0.35}s`;
            shareBtn.innerHTML = '<span>📸</span> 대진표 이미지로 공유';
            shareBtn.onclick = shareResultImage;
            resultsDiv.appendChild(shareBtn);

            // 아이폰 사파리는 버튼을 누른 직후에만 공유 창을 열어주므로 이미지를 미리 만들어 둔다
            prepareShareImage(matchData);

            setTimeout(() => {
                window.scrollTo({ top: resultsDiv.offsetTop - 40, behavior: 'smooth' });
            }, 400);
        }

        // ===== 대진표 이미지 만들기·공유 =====
        // 외부 라이브러리 없이 Canvas로 화면의 당구대 카드를 그대로 그린다.
        const IMG_FONT = "'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
        const IMG_WIDTH = 420;   // 논리 폭(px)
        const IMG_SCALE = 3;     // 실제 해상도 배율 (1260px)
        const IMG_MAX_PIXELS = 16000000; // 아이폰 사파리 캔버스 한도(약 1,670만 화소) 이내로 유지
        let shareImage = null;   // { blob, fileName }

        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 띄어쓰기 기준으로 줄바꿈하고, 한 단어가 너무 길면 글자 단위로 자른다
        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            let line = '';
            for (const word of text.split(' ')) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width <= maxWidth) {
                    line = test;
                    continue;
                }
                if (line) lines.push(line);
                line = '';
                for (const ch of word) {
                    if (line && ctx.measureText(line + ch).width > maxWidth) {
                        lines.push(line);
                        line = ch;
                    } else {
                        line += ch;
                    }
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        // 이름이 상자에 들어가도록 글씨 크기를 줄인다
        function fitNameFont(ctx, text, maxWidth) {
            let size = 18;
            while (size > 12) {
                ctx.font = `800 ${size}px ${IMG_FONT}`;
                if (ctx.measureText(text).width <= maxWidth) return;
                size -= 1;
            }
            ctx.font = `800 ${size}px ${IMG_FONT}`;
        }

        const CARD = { rail: 7, pad: 18, header: 24, gap: 12, box: 52, line: 20 };

        function commentLines(ctx, text, width) {
            ctx.font = `500 14px ${IMG_FONT}`;
            return wrapText(ctx, text, width - CARD.pad * 2 - CARD.rail * 2 - 8);
        }

        function cardHeight(lines) {
            return CARD.rail * 2 + CARD.pad + CARD.header + CARD.gap + CARD.box + CARD.gap
                + lines.length * CARD.line + CARD.pad - 4;
        }

        function drawNameBox(ctx, x, y, w, name) {
            roundRectPath(ctx, x, y, w, CARD.box, 12);
            ctx.fillStyle = '#141b22';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(5, 7, 10, 0.35)';
            ctx.stroke();
            fitNameFont(ctx, name, w - 10);
            ctx.fillStyle = '#d4af37';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, x + w / 2, y + CARD.box / 2 + 1, w - 10);
        }

        // 당구대 카드 한 장 (진회색 레일 + 은색 띠 + 파란 천 + 레일 포인트)
        function drawCard(ctx, x, y, w, title, lines, names) {
            const h = cardHeight(lines);
            const r = CARD.rail;
            const ix = x + r, iy = y + r, iw = w - r * 2, ih = h - r * 2;

            roundRectPath(ctx, x, y, w, h, 16);
            ctx.fillStyle = '#3f4247';
            ctx.fill();

            // 파란 천: 조명처럼 가운데가 밝고 바깥이 어두운 타원형 그라데이션
            ctx.save();
            roundRectPath(ctx, ix, iy, iw, ih, 10);
            ctx.clip();
            const rx = iw * 0.7, ry = ih * 0.72;
            ctx.save();
            ctx.translate(ix + iw / 2, iy + ih * 0.6);
            ctx.scale(1, ry / rx);
            const felt = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
            felt.addColorStop(0, '#3592e4');
            felt.addColorStop(0.45, '#2a7fd4');
            felt.addColorStop(0.8, '#2068bb');
            felt.addColorStop(1, '#1b5ca9');
            ctx.fillStyle = felt;
            ctx.fillRect(-rx * 3, -rx * 3, rx * 6, rx * 6);
            ctx.restore();
            const shade = ctx.createLinearGradient(0, iy, 0, iy + 52);
            shade.addColorStop(0, 'rgba(8, 32, 72, 0.42)');
            shade.addColorStop(1, 'rgba(8, 32, 72, 0)');
            ctx.fillStyle = shade;
            ctx.fillRect(ix, iy, iw, 52);
            ctx.restore();

            // 은색 띠
            roundRectPath(ctx, ix + 1, iy + 1, iw - 2, ih - 2, 9);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#9aa3ae';
            ctx.stroke();

            // 위·아래 레일 포인트
            ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
            for (let k = 0; k < 8; k++) {
                const dx = x + (k + 0.5) * w / 8;
                for (const dy of [y + r / 2, y + h - r / 2]) {
                    ctx.beginPath();
                    ctx.arc(dx, dy, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const cx = x + w / 2;
            const cw = iw - CARD.pad * 2;
            const left = ix + CARD.pad;
            let cy = iy + CARD.pad;

            // 헤더 (MATCH n / 부전승)
            ctx.save();
            ctx.shadowColor = 'rgba(0, 20, 50, 0.6)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetY = 1;
            ctx.fillStyle = '#ffffff';
            ctx.font = `900 19px ${IMG_FONT}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, cx, cy + CARD.header / 2);
            ctx.restore();
            cy += CARD.header + CARD.gap;

            // 선수 이름
            if (names.length === 2) {
                const bw = cw * 0.44;
                drawNameBox(ctx, left, cy, bw, names[0]);
                drawNameBox(ctx, left + cw - bw, cy, bw, names[1]);
                ctx.fillStyle = '#333';
                ctx.font = `900 13px ${IMG_FONT}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('VS', cx, cy + CARD.box / 2);
            } else {
                drawNameBox(ctx, left, cy, cw, names[0]);
            }
            cy += CARD.box + CARD.gap;

            // 코멘트
            ctx.save();
            ctx.shadowColor = 'rgba(0, 20, 50, 0.6)';
            ctx.shadowBlur = 3;
            ctx.shadowOffsetY = 1;
            ctx.fillStyle = '#ffffff';
            ctx.font = `500 14px ${IMG_FONT}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            lines.forEach((ln, idx) => ctx.fillText(ln, cx, cy + CARD.line * idx + CARD.line / 2 - 2));
            ctx.restore();

            return h;
        }

        function renderResultImage(data) {
            const W = IMG_WIDTH, M = 16, cardW = W - M * 2, TOP = 112, FOOT = 44, SPACING = 14;
            const measure = document.createElement('canvas').getContext('2d');
            const cards = data.pairs.map((m, idx) => ({
                title: `MATCH ${idx + 1}`, names: [m.p1, m.p2], lines: commentLines(measure, m.comment, cardW)
            }));
            if (data.bye) {
                cards.push({ title: '부전승', names: [data.bye.name], lines: commentLines(measure, data.bye.comment, cardW) });
            }
            const H = TOP + cards.reduce((sum, c) => sum + cardHeight(c.lines) + SPACING, 0) + FOOT;

            const scale = Math.min(IMG_SCALE, Math.sqrt(IMG_MAX_PIXELS / (W * H)));
            const canvas = document.createElement('canvas');
            canvas.width = Math.floor(W * scale);
            canvas.height = Math.floor(H * scale);
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, W, H);

            // 상단 제목
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.save();
            ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#d4af37';
            ctx.font = `900 30px ${IMG_FONT}`;
            ctx.fillText('THE BRIDGE', W / 2, 36);
            ctx.restore();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = `600 13px ${IMG_FONT}`;
            ctx.fillText("Today's Villain Matching", W / 2, 64);
            const d = new Date();
            const today = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
            ctx.fillStyle = '#f1d592';
            ctx.font = `700 13px ${IMG_FONT}`;
            ctx.fillText(`${today} · 참석 ${data.attendCount}명`, W / 2, 86);

            let y = TOP;
            cards.forEach(c => {
                y += drawCard(ctx, M, y, cardW, c.title, c.lines, c.names) + SPACING;
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.font = `500 11px ${IMG_FONT}`;
            ctx.textAlign = 'center';
            ctx.fillText('© THE BRIDGE BILLIARDS CLUB', W / 2, y + 14);

            return canvas;
        }

        function prepareShareImage(data) {
            shareImage = null;
            const d = new Date();
            const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const fileName = `더브릿지_대진표_${stamp}.jpg`;
            renderResultImage(data).toBlob(blob => {
                if (blob) shareImage = { blob, fileName };
            }, 'image/jpeg', 0.92);
        }

        async function shareResultImage() {
            if (!shareImage) {
                alert('이미지를 만드는 중입니다. 잠시 후 다시 눌러주세요.');
                return;
            }
            const { blob, fileName } = shareImage;
            const file = new File([blob], fileName, { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: '오늘의 대진표' });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return; // 사용자가 공유 창을 닫음
                }
            }
            openSharePreview(blob, fileName);
        }

        // 공유 기능이 없는 환경(PC, 일부 앱 내장 브라우저)에서는 미리보기 + 저장 버튼을 보여준다
        function openSharePreview(blob, fileName) {
            const url = URL.createObjectURL(blob);
            document.getElementById('sharePreviewImg').src = url;
            const link = document.getElementById('shareDownload');
            link.href = url;
            link.download = fileName;
            document.getElementById('sharePreview').hidden = false;
        }

        function closeSharePreview() {
            const preview = document.getElementById('sharePreview');
            preview.hidden = true;
            const img = document.getElementById('sharePreviewImg');
            if (img.src) URL.revokeObjectURL(img.src);
            img.removeAttribute('src');
        }

        window.onload = () => {
            initCanvas();
            renderRoster();
        };
        window.onresize = initCanvas;
    </script>
</body>
